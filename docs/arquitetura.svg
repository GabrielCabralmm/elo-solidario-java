<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1190" viewBox="0 0 1600 1190" font-family="Inter, DejaVu Sans, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/>
    </marker>
    <marker id="setaVerde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3F8F68"/>
    </marker>
    <marker id="setaCinza" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
    <g id="pessoa">
      <circle cx="0" cy="-14" r="11" fill="#3F8F68"/>
      <path d="M-20,22 Q-20,0 0,0 Q20,0 20,22 z" fill="#3F8F68"/>
    </g>
  </defs>

  <rect width="1600" height="1190" fill="#FFFFFF"/>

  <!-- Título -->
  <text x="40" y="44" font-size="28" font-weight="700" fill="#111827">EloSolidário — Arquitetura da solução e esteira CI/CD</text>
  <text x="40" y="72" font-size="16" fill="#4B5563">API Java (Spring Boot) publicada no Azure App Service com banco Azure SQL, entregue pelo Azure Pipelines (Build + Release) a partir do Azure Boards e Repos</text>

  <!-- Desenvolvedor -->
  <rect x="40" y="110" width="250" height="190" rx="14" fill="#ECF6F0" stroke="#3F8F68" stroke-width="2"/>
  <use href="#pessoa" x="80" y="160"/>
  <text x="112" y="152" font-size="18" font-weight="700" fill="#111827">Desenvolvedor</text>
  <text x="112" y="174" font-size="14" fill="#374151">Gabriel / João</text>
  <rect x="58" y="200" width="214" height="82" rx="8" fill="#FFFFFF" stroke="#9CA3AF"/>
  <text x="72" y="224" font-size="15" font-weight="600" fill="#111827">IDE / editor do Repos</text>
  <text x="72" y="246" font-size="13" fill="#374151">Java 21 + Maven</text>
  <text x="72" y="266" font-size="13" fill="#374151">branch · commit · push</text>

  <!-- Professor -->
  <rect x="40" y="340" width="250" height="106" rx="14" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="58" y="368" font-size="16" font-weight="700" fill="#111827">Professor</text>
  <text x="58" y="392" font-size="13" fill="#374151">Basic na organização e</text>
  <text x="58" y="410" font-size="13" fill="#374151">Project Administrators: Boards,</text>
  <text x="58" y="428" font-size="13" fill="#374151">Repos, Pipelines e execuções</text>

  <!-- Azure DevOps -->
  <rect x="360" y="96" width="1200" height="304" rx="16" fill="#EFF6FF" stroke="#0078D4" stroke-width="2"/>
  <text x="384" y="128" font-size="20" font-weight="700" fill="#0B4A8B">Azure DevOps</text>
  <text x="550" y="128" font-size="14" fill="#1E3A5F">Projeto privado “EloSolidario” · Boards · Repos · Pipelines</text>

  <rect x="380" y="146" width="190" height="234" rx="12" fill="#FFFFFF" stroke="#0078D4" stroke-width="1.5"/>
  <text x="398" y="174" font-size="17" font-weight="700" fill="#0B4A8B">Boards + Repos</text>
  <text x="398" y="196" font-size="13" fill="#6B7280">elo-solidario-devops</text>
  <text x="398" y="224" font-size="14" fill="#111827">• Tarefa (work item)</text>
  <text x="398" y="248" font-size="14" fill="#111827">• Branch feature</text>
  <text x="398" y="272" font-size="14" fill="#111827">• Pull Request</text>
  <text x="398" y="296" font-size="14" fill="#111827">• Merge na main</text>
  <rect x="396" y="310" width="158" height="22" rx="11" fill="#111827"/>
  <text x="475" y="326" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">main protegida</text>
  <text x="398" y="352" font-size="11" fill="#6B7280">revisor RM563230</text>
  <text x="398" y="368" font-size="11" fill="#6B7280">1 aprovação · work item</text>

  <rect x="600" y="146" width="322" height="234" rx="12" fill="#FFFFFF" stroke="#0078D4" stroke-width="1.5"/>
  <text x="620" y="174" font-size="17" font-weight="700" fill="#0B4A8B">Build (CI) · estágio Build</text>
  <text x="620" y="196" font-size="13" fill="#6B7280">azure-pipeline.yml · ubuntu-latest</text>
  <text x="620" y="226" font-size="14" fill="#111827">• Cache das dependências Maven</text>
  <text x="620" y="252" font-size="14" fill="#111827">• Maven clean package (Java 21)</text>
  <text x="620" y="278" font-size="14" fill="#111827">• Testes JUnit 5 + Mockito</text>
  <text x="620" y="304" font-size="14" fill="#111827">• Publica os resultados JUnit</text>
  <text x="620" y="330" font-size="14" fill="#111827">• Copy Files + Publish Artifact</text>
  <text x="620" y="364" font-size="12" fill="#6B7280">Trigger: merge na main · pr: none</text>

  <rect x="950" y="196" width="130" height="120" rx="12" fill="#FFF7E6" stroke="#D97706" stroke-width="1.5"/>
  <rect x="992" y="212" width="46" height="38" rx="4" fill="#D97706"/>
  <path d="M992,224 h46 M1015,212 v12" stroke="#FFF7E6" stroke-width="2"/>
  <text x="1015" y="274" font-size="15" font-weight="700" fill="#92400E" text-anchor="middle">Artefato</text>
  <text x="1015" y="292" font-size="11" fill="#92400E" text-anchor="middle">elo-solidario-java</text>
  <text x="1015" y="306" font-size="11" fill="#92400E" text-anchor="middle">.jar + scripts</text>

  <rect x="1110" y="146" width="430" height="156" rx="12" fill="#FFFFFF" stroke="#0078D4" stroke-width="1.5"/>
  <text x="1130" y="174" font-size="17" font-weight="700" fill="#0B4A8B">Release (CD) · estágio Release</text>
  <text x="1130" y="196" font-size="13" fill="#6B7280">environment producao · roda sozinho após o Build</text>
  <text x="1130" y="222" font-size="14" fill="#111827">• Baixa o artefato novo do CI</text>
  <text x="1130" y="244" font-size="14" fill="#111827">• AzureWebApp@1: deploy do .jar (Java 21)</text>
  <text x="1130" y="266" font-size="14" fill="#111827">• App settings com as variáveis secretas</text>
  <text x="1130" y="288" font-size="14" fill="#111827">• Teste de fumaça: GET /status</text>

  <rect x="1110" y="316" width="430" height="68" rx="12" fill="#FDF2F8" stroke="#BE185D" stroke-width="1.5"/>
  <rect x="1128" y="338" width="22" height="18" rx="3" fill="#BE185D"/>
  <path d="M1132,338 v-6 a7,7 0 0 1 14,0 v6" stroke="#BE185D" stroke-width="3" fill="none"/>
  <text x="1162" y="342" font-size="15" font-weight="700" fill="#831843">Variáveis · grupo elo-solidario-segredos</text>
  <text x="1162" y="364" font-size="12" fill="#9D174D">DB_URL, DB_PASSWORD, JWT_SECRET, RABBITMQ_URL,</text>
  <text x="1162" y="378" font-size="12" fill="#9D174D">AI_API_KEY (cadeado: secretas)</text>

  <!-- Microsoft Azure -->
  <rect x="360" y="450" width="820" height="420" rx="16" fill="#F0F9FF" stroke="#0078D4" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="384" y="482" font-size="20" font-weight="700" fill="#0B4A8B">Microsoft Azure</text>
  <text x="552" y="482" font-size="14" fill="#1E3A5F">rg-elosolidario · Chile Central</text>

  <rect x="380" y="506" width="420" height="250" rx="12" fill="#FFFFFF" stroke="#0078D4" stroke-width="1.5"/>
  <text x="400" y="534" font-size="14" font-weight="600" fill="#1E3A5F">Plano do App Service · plan-elosolidario (Linux B1)</text>
  <rect x="400" y="550" width="380" height="186" rx="10" fill="#E0F2FE" stroke="#0369A1"/>
  <rect x="420" y="572" width="44" height="34" rx="4" fill="#0078D4"/>
  <path d="M420,582 h44" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="427" cy="577" r="2" fill="#FFFFFF"/><circle cx="434" cy="577" r="2" fill="#FFFFFF"/>
  <text x="478" y="586" font-size="17" font-weight="700" fill="#0B4A8B">Web App · elo-solidario</text>
  <text x="478" y="606" font-size="13" fill="#1E3A5F">Java 21 (Java SE) · sem container</text>
  <text x="420" y="640" font-size="14" fill="#111827">• Spring Boot 3.5 + Spring Security + JWT</text>
  <text x="420" y="664" font-size="14" fill="#111827">• Perfis: doador, beneficiário e admin</text>
  <text x="420" y="688" font-size="14" fill="#111827">• REST + Swagger · Spring Data JPA</text>
  <text x="420" y="712" font-size="14" fill="#111827">• Spring AI (Gemini) · RabbitMQ</text>

  <rect x="840" y="506" width="320" height="250" rx="12" fill="#FFFFFF" stroke="#0078D4" stroke-width="1.5"/>
  <ellipse cx="886" cy="550" rx="26" ry="9" fill="#0B5CAD"/>
  <rect x="860" y="550" width="52" height="40" fill="#0B5CAD"/>
  <ellipse cx="886" cy="590" rx="26" ry="9" fill="#0B5CAD"/>
  <ellipse cx="886" cy="550" rx="26" ry="9" fill="#4A9BE0"/>
  <text x="926" y="556" font-size="17" font-weight="700" fill="#0B4A8B">Azure SQL</text>
  <text x="926" y="578" font-size="17" font-weight="700" fill="#0B4A8B">Database</text>
  <text x="860" y="626" font-size="13" fill="#1E3A5F">PaaS · sql-elosolidario · Basic</text>
  <text x="860" y="650" font-size="14" fill="#111827">Banco db-elosolidario</text>
  <text x="860" y="674" font-size="14" fill="#111827">8 tabelas TB_ELO_*</text>
  <text x="860" y="698" font-size="14" fill="#111827">gatilhos de auditoria e reservas</text>
  <text x="860" y="722" font-size="13" fill="#6B7280">scripts/script-bd.sql (T-SQL)</text>

  <rect x="380" y="780" width="780" height="70" rx="12" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
  <rect x="400" y="798" width="40" height="32" rx="4" fill="#1F2937"/>
  <path d="M408,808 l8,6 l-8,6 M420,822 h12" stroke="#FFFFFF" stroke-width="2" fill="none"/>
  <text x="456" y="810" font-size="16" font-weight="700" fill="#111827">Azure CLI (Cloud Shell) · scripts/infra-azure.sh</text>
  <text x="456" y="832" font-size="14" fill="#374151">cria o grupo de recursos, o Azure SQL, o firewall, o banco, o plano, o Web App e as variáveis</text>

  <!-- Serviços externos -->
  <rect x="1210" y="450" width="350" height="420" rx="16" fill="#F9FAFB" stroke="#6B7280" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1234" y="482" font-size="20" font-weight="700" fill="#374151">Serviços externos</text>

  <rect x="1230" y="506" width="310" height="124" rx="12" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
  <rect x="1250" y="526" width="40" height="34" rx="6" fill="#EA580C"/>
  <text x="1270" y="548" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">MQ</text>
  <text x="1302" y="540" font-size="16" font-weight="700" fill="#111827">CloudAMQP</text>
  <text x="1302" y="558" font-size="13" fill="#374151">RabbitMQ gerenciado</text>
  <text x="1250" y="588" font-size="13" fill="#111827">exchange elo.reservas</text>
  <text x="1250" y="608" font-size="13" fill="#111827">fila elo.notificacoes · AMQPS</text>

  <rect x="1230" y="650" width="310" height="124" rx="12" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
  <rect x="1250" y="670" width="40" height="34" rx="6" fill="#4F46E5"/>
  <text x="1270" y="692" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">IA</text>
  <text x="1302" y="684" font-size="16" font-weight="700" fill="#111827">Google Gemini</text>
  <text x="1302" y="702" font-size="13" fill="#374151">gemini-3.5-flash-lite</text>
  <text x="1250" y="732" font-size="13" fill="#111827">assistente de doação (Spring AI)</text>
  <text x="1250" y="752" font-size="13" fill="#111827">API compatível com OpenAI · HTTPS</text>

  <text x="1234" y="810" font-size="12" fill="#6B7280">As chaves de acesso ficam nas</text>
  <text x="1234" y="828" font-size="12" fill="#6B7280">variáveis secretas da pipeline</text>
  <text x="1234" y="846" font-size="12" fill="#6B7280">e nas App Settings do Web App.</text>

  <!-- Usuários finais -->
  <rect x="40" y="560" width="250" height="250" rx="14" fill="#ECF6F0" stroke="#3F8F68" stroke-width="2"/>
  <text x="60" y="592" font-size="18" font-weight="700" fill="#111827">Usuários finais</text>
  <text x="60" y="612" font-size="13" fill="#4B5563">app mobile · Swagger · HTTPS</text>
  <use href="#pessoa" x="82" y="660"/>
  <text x="112" y="666" font-size="15" fill="#111827">Doador</text>
  <use href="#pessoa" x="82" y="716"/>
  <text x="112" y="722" font-size="15" fill="#111827">Beneficiário</text>
  <use href="#pessoa" x="82" y="772"/>
  <text x="112" y="778" font-size="15" fill="#111827">Administrador</text>

