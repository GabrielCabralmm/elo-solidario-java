  <path d="M290,240 H380" stroke="#1F2937" stroke-width="2.5" fill="none" marker-end="url(#seta)"/>
  <path d="M570,256 H600" stroke="#1F2937" stroke-width="2.5" fill="none" marker-end="url(#seta)"/>
  <path d="M922,256 H950" stroke="#1F2937" stroke-width="2.5" fill="none" marker-end="url(#seta)"/>
