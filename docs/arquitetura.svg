  <text x="1540" y="412" font-size="13" font-weight="600" fill="#1F2937" text-anchor="end">deploy do .jar no App Service</text>
  <text x="810" y="696" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle">JDBC</text>

  <!-- Ordem do fluxo -->
  <rect x="40" y="900" width="1520" height="250" rx="14" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="64" y="932" font-size="17" font-weight="700" fill="#111827">Ordem do fluxo</text>
  <g font-size="14" fill="#111827">
    <text x="64" y="962"><tspan font-weight="700">0.</tspan> O desenvolvedor cria os recursos no Azure com o Azure CLI (uma vez).</text>
    <text x="64" y="990"><tspan font-weight="700">1.</tspan> Cria a tarefa no Boards, a branch, o commit e o Pull Request no Azure Repos.</text>
    <text x="64" y="1018"><tspan font-weight="700">2.</tspan> O PR aprovado faz o merge na main, que dispara o Build (CI) sozinho.</text>
    <text x="64" y="1046"><tspan font-weight="700">3.</tspan> O CI compila com Maven e Java 21 e roda os testes automatizados.</text>
    <text x="64" y="1074"><tspan font-weight="700">4.</tspan> O CI publica o artefato (.jar e scripts) e os resultados dos testes.</text>
    <text x="64" y="1102"><tspan font-weight="700">5.</tspan> O novo artefato dispara automaticamente a Release (CD).</text>
    <text x="820" y="962"><tspan font-weight="700">6.</tspan> A Release lê as credenciais nas variáveis secretas.</text>
    <text x="820" y="990"><tspan font-weight="700">7.</tspan> A Release faz o deploy do .jar no Web App e roda o teste de fumaça.</text>
    <text x="820" y="1018"><tspan font-weight="700">8.</tspan> A API grava e lê os dados no Azure SQL, onde os gatilhos auditam as doações.</text>
    <text x="820" y="1046"><tspan font-weight="700">9.</tspan> A API publica eventos de reserva no CloudAMQP e consulta o Gemini.</text>
    <text x="820" y="1074"><tspan font-weight="700">10.</tspan> Doador, beneficiário e admin acessam por HTTPS com JWT e fazem o CRUD.</text>
  </g>
  <g font-size="12" fill="#4B5563">
    <path d="M820,1104 H858" stroke="#1F2937" stroke-width="2.5" marker-end="url(#seta)"/>
    <text x="866" y="1108">fluxo do código e do deploy</text>
    <path d="M1040,1104 H1078" stroke="#6B7280" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#setaCinza)"/>
    <text x="1086" y="1108">provisionamento / integração</text>
    <path d="M1270,1104 H1308" stroke="#3F8F68" stroke-width="3" marker-end="url(#setaVerde)"/>
    <text x="1316" y="1108">acesso dos usuários</text>
    <text x="820" y="1132">Caixa azul contínua: Azure DevOps · tracejada azul: recursos na Azure · tracejada cinza: serviços externos</text>
  </g>
</svg>
